name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: instabox-medium
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Skip CI when only Markdown or docs/ changed
        id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base=""
          [ "$EVENT" = pull_request ] && base="$PR_BASE"
          [ "$EVENT" = push ] && base="$PUSH_BEFORE"
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] \
            || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Docs-only = every changed file is Markdown (README etc.) or under docs/.
          if git diff --name-only "$base" HEAD | grep -qvE '(^docs/|\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only change: skipping checks and integration tests."
          fi

  quality:
    name: Lint, syntax and unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: instabox-medium
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Install locked dependencies
        run: uv sync --locked --group dev --python 3.11

      - name: Check Python lint
        run: uv run --no-sync ruff check .

      - name: Check Python formatting
        run: uv run --no-sync ruff format --check .

      - name: Check shell script syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            bash -n "$file"
          done < <(git ls-files -z '*.sh')

      - name: Validate JSON, YAML, and notebook syntax
        run: |
          uv run --no-sync python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          import yaml

          files = subprocess.check_output(
              ["git", "ls-files", "-z"]
          ).decode().split("\0")

          for filename in filter(None, files):
              path = Path(filename)
              suffix = path.suffix.lower()

              if suffix in {".json", ".ipynb"}:
                  json.loads(path.read_text(encoding="utf-8"))
                  print(f"Valid JSON: {path}")
              elif suffix in {".yaml", ".yml"}:
                  list(yaml.safe_load_all(path.read_text(encoding="utf-8")))
                  print(f"Valid YAML: {path}")
          PY

      - name: Run unit tests
        # Includes the schema/classification/access-contract drift checks.
        run: uv run --no-sync pytest tests/unit -v --strict-config --strict-markers --junitxml=unit-test-results.xml

  integration:
    # Each suite starts its own isolated Compose stack, so they run in parallel.
    name: Integration (${{ matrix.suite }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: instabox-medium
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: storage
            flag: RUN_STORAGE_INTEGRATION
            tests: tests/integration/test_storage.py
          - suite: catalog
            flag: RUN_CATALOG_INTEGRATION
            tests: tests/integration/test_catalog.py
          - suite: trino
            flag: RUN_TRINO_INTEGRATION
            tests: tests/integration/test_trino.py
          - suite: audit
            flag: RUN_AUDIT_INTEGRATION
            tests: tests/integration/test_audit.py
          - suite: policy
            flag: RUN_POLICY_INTEGRATION
            tests: tests/integration/test_policy.py
          - suite: access
            flag: RUN_ACCESS_INTEGRATION
            tests: tests/access
          - suite: bypass
            flag: RUN_BYPASS_INTEGRATION
            tests: tests/bypass
          - suite: schema
            flag: RUN_SCHEMA_INTEGRATION
            tests: tests/integration/test_silver_schema.py
          - suite: ingest
            flag: RUN_INGEST_INTEGRATION
            tests: tests/integration/test_ingestion.py
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Install locked dependencies
        run: uv sync --locked --group dev --python 3.11

      - name: Run ${{ matrix.suite }} integration tests
        # Env keys cannot be expressions, so the suite's opt-in flag is set here.
        run: env "${{ matrix.flag }}=1" uv run --no-sync pytest ${{ matrix.tests }} -v --strict-config --strict-markers

  gate:
    # Keeps the branch-protection required check name. Passes when every job
    # passed, or when checks were skipped for a docs-only change.
    name: Code and configuration checks
    if: always()
    needs: [changes, quality, integration]
    runs-on: instabox-medium
    timeout-minutes: 5
    steps:
      - name: Require every job to pass or be skipped
        shell: bash
        run: |
          test "${{ needs.changes.result }}" = success
          for result in "${{ needs.quality.result }}" "${{ needs.integration.result }}"; do
            [ "$result" = success ] || [ "$result" = skipped ] || exit 1
          done
