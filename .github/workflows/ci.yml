name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code and configuration checks
    runs-on: instabox-medium
    timeout-minutes: 45
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Install locked dependencies
        run: uv sync --locked --group dev --python 3.11

      - name: Check Python lint
        run: uv run --no-sync ruff check .

      - name: Check Python formatting
        run: uv run --no-sync ruff format --check .

      - name: Check shell script syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            bash -n "$file"
          done < <(git ls-files -z '*.sh')

      - name: Validate JSON, YAML, and notebook syntax
        run: |
          uv run --no-sync python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          import yaml

          files = subprocess.check_output(
              ["git", "ls-files", "-z"]
          ).decode().split("\0")

          for filename in filter(None, files):
              path = Path(filename)
              suffix = path.suffix.lower()

              if suffix in {".json", ".ipynb"}:
                  json.loads(path.read_text(encoding="utf-8"))
                  print(f"Valid JSON: {path}")
              elif suffix in {".yaml", ".yml"}:
                  list(yaml.safe_load_all(path.read_text(encoding="utf-8")))
                  print(f"Valid YAML: {path}")
          PY

      - name: Run unit tests
        # Includes the schema/classification/access-contract drift checks.
        run: uv run --no-sync pytest tests/unit -v --strict-config --strict-markers --junitxml=unit-test-results.xml

      # Configure these repository Actions secrets to avoid Docker Hub's anonymous pull limit.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify private storage and service permissions
        env:
          RUN_STORAGE_INTEGRATION: "1"
        run: uv run --no-sync pytest tests/integration/test_storage.py -v --strict-config

      - name: Verify authenticated catalog and Iceberg persistence
        env:
          RUN_CATALOG_INTEGRATION: "1"
        run: uv run --no-sync pytest tests/integration/test_catalog.py -v --strict-config

      - name: Verify Trino HTTPS authentication and system policy enforcement
        env:
          RUN_TRINO_INTEGRATION: "1"
        run: uv run --no-sync pytest tests/integration/test_trino.py -v --strict-config

      - name: Verify Trino query events reach the restricted audit table once
        env:
          RUN_AUDIT_INTEGRATION: "1"
        run: uv run --no-sync pytest tests/integration/test_audit.py -v --strict-config


      - name: Verify clinical access matrix, doctor filters, masks and denials
        env:
          RUN_POLICY_INTEGRATION: "1"
        run: uv run --no-sync pytest tests/integration/test_policy.py -v --strict-config

      - name: Verify authenticated access with independent saved oracles
        env:
          RUN_ACCESS_INTEGRATION: "1"
        run: uv run --no-sync pytest tests/access -v --strict-config --strict-markers --junitxml=access-test-results.xml

      - name: Install Java 17 for the reproducible Synthea privacy cohort
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate the seeded 1,000-patient Synthea privacy cohort
        run: uv run --no-sync python scripts/source_data.py synthea --patients 1000 --seed 42

      - name: Investigate every bypass case on the 1,000-patient cohort
        env:
          RUN_BYPASS_INTEGRATION: "1"
          ACCESS_TEST_SOURCE: ${{ github.workspace }}/data/raw/synthea/1000-seed42
        run: uv run --no-sync pytest tests/bypass -v --strict-config --strict-markers --junitxml=bypass-test-results.xml

      - name: Summarize bypass outcomes without identifiers
        if: always()
        run: uv run --no-sync python scripts/results_summary.py 'results/raw/bypass-*' results/raw/ci-summary

      - name: Publish aggregate-only bypass, audit-coverage and privacy summaries
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-24-privacy-metrics
          path: results/raw/ci-summary/
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify silver and restricted identity DDL on Trino and Iceberg
        env:
          RUN_SCHEMA_INTEGRATION: "1"
        run: uv run --no-sync pytest tests/integration/test_silver_schema.py -v --strict-config

      - name: Verify trusted ETL ingestion and safe reruns on Iceberg
        env:
          RUN_INGEST_INTEGRATION: "1"
        run: uv run --no-sync pytest tests/integration/test_ingestion.py -v --strict-config
