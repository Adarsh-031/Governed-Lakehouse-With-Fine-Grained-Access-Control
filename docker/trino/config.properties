coordinator=true
node-scheduler.include-coordinator=true
http-server.http.enabled=false
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/etc/trino/auth/trino.pem
http-server.authentication.type=PASSWORD
http-server.authentication.allow-insecure-over-http=false
http-server.process-forwarded=false
internal-communication.shared-secret=${ENV:TRINO_INTERNAL_SHARED_SECRET}
internal-communication.https.required=true
internal-communication.https.truststore.path=/etc/trino/auth/ca.crt
discovery.uri=https://127.0.0.1:8443
catalog.management=static
