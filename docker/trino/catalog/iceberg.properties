connector.name=iceberg
iceberg.catalog.type=rest
iceberg.security=SYSTEM
iceberg.rest-catalog.uri=http://catalog:8181/catalog
iceberg.rest-catalog.warehouse=hospital
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.server-uri=http://keycloak:8080/realms/lakehouse/protocol/openid-connect/token
iceberg.rest-catalog.oauth2.credential=trino:${ENV:TRINO_OIDC_CLIENT_SECRET}
iceberg.rest-catalog.oauth2.scope=openid
iceberg.rest-catalog.vended-credentials-enabled=false
fs.native-s3.enabled=true
s3.endpoint=http://storage:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:TRINO_STORAGE_ACCESS_KEY}
s3.aws-secret-key=${ENV:TRINO_STORAGE_SECRET_KEY}
