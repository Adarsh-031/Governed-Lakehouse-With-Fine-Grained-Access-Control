# Trino 476 bundled HTTP event listener -> internal audit collector (#20, #21).
# Created and completed events only; split events add volume, not access evidence.
event-listener.name=http
http-event-listener.log-created=true
http-event-listener.log-completed=true
http-event-listener.log-split=false
http-event-listener.connect-ingest-uri=http://audit-collector:8090/v1/events
http-event-listener.connect-http-headers=Authorization:Bearer ${ENV:AUDIT_INGEST_TOKEN}
# The collector answers 503 when it cannot persist; Trino retries 5xx with backoff
# (1s, 2s, 4s, ... capped at 30s). Connection failures are not retried by Trino,
# so the collector must be healthy before Trino starts (see compose.yaml).
http-event-listener.connect-retry-count=6
http-event-listener.connect-retry-delay=1s
http-event-listener.connect-backoff-base=2
http-event-listener.connect-max-delay=30s
