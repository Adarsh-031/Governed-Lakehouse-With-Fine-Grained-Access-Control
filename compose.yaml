# Private storage/catalog; Trino HTTPS is the only published service.
x-catalog-image: &catalog-image quay.io/lakekeeper/catalog:v0.14.0
x-postgres: &postgres
  image: postgres:17.11-bookworm
  networks: [backend]
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 10s
x-catalog-environment: &catalog-environment
  LAKEKEEPER__PG_HOST_W: catalog-db
  LAKEKEEPER__PG_PORT: "5432"
  LAKEKEEPER__PG_USER: lakekeeper
  LAKEKEEPER__PG_DATABASE: lakekeeper
  LAKEKEEPER__PG_PASSWORD: ${CATALOG_DB_PASSWORD:?Catalog database password is required}
  LAKEKEEPER__PG_SSL_MODE: disable
  LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_ENCRYPTION_KEY:?Catalog encryption key is required}
  LAKEKEEPER__AUTHZ_BACKEND: openfga
  LAKEKEEPER__OPENFGA__ENDPOINT: http://openfga:8081
  LAKEKEEPER__OPENFGA__API_KEY: ${OPENFGA_PRESHARED_KEY:?OpenFGA API key is required}
  LAKEKEEPER__OPENID_PROVIDER_URI: http://keycloak:8080/realms/lakehouse
  LAKEKEEPER__OPENID_AUDIENCE: lakekeeper
  LAKEKEEPER__OPENID_SUBJECT_CLAIM: sub
  LAKEKEEPER__ENABLE_DEFAULT_PROJECT: "true"
  LAKEKEEPER__USE_X_FORWARDED_HEADERS: "false"
  LAKEKEEPER__DEBUG__LOG_REQUEST_BODIES: "false"
  RUST_LOG: info
x-openfga-environment: &openfga-environment
  OPENFGA_DATASTORE_ENGINE: postgres
  OPENFGA_DATASTORE_URI: postgres://openfga:${OPENFGA_DB_PASSWORD:?OpenFGA database password is required}@openfga-db:5432/openfga?sslmode=disable
x-catalog-client: &catalog-client
  image: governed-lakehouse-catalog-tools:local
  build:
    context: .
    dockerfile: docker/catalog/Dockerfile
  networks: [backend]
  read_only: true
  tmpfs:
    - /tmp:mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: "no"
  environment: &catalog-client-environment
    ETL_OIDC_CLIENT_SECRET: ${ETL_OIDC_CLIENT_SECRET:?ETL OIDC secret is required}
    ETL_STORAGE_ACCESS_KEY: ${ETL_STORAGE_ACCESS_KEY:?ETL access key is required}
    ETL_STORAGE_SECRET_KEY: ${ETL_STORAGE_SECRET_KEY:?ETL secret key is required}
    TRINO_OIDC_CLIENT_SECRET: ${TRINO_OIDC_CLIENT_SECRET:?Trino OIDC secret is required}
    TRINO_STORAGE_ACCESS_KEY: ${TRINO_STORAGE_ACCESS_KEY:?Trino access key is required}
    TRINO_STORAGE_SECRET_KEY: ${TRINO_STORAGE_SECRET_KEY:?Trino secret key is required}
    AUDIT_WRITER_OIDC_CLIENT_SECRET: ${AUDIT_WRITER_OIDC_CLIENT_SECRET:?Audit OIDC secret is required}
x-storage-image: &storage-image pgsty/silo:RELEASE.2026-09-03T13-18-01Z
x-bootstrap-environment: &bootstrap-environment
  STORAGE_ROOT_USER: ${STORAGE_ROOT_USER:?Run scripts/init_secrets.sh and pass --env-file data/secrets/runtime.env}
  STORAGE_ROOT_PASSWORD: ${STORAGE_ROOT_PASSWORD:?Storage root password is required}
  ETL_STORAGE_ACCESS_KEY: ${ETL_STORAGE_ACCESS_KEY:?ETL access key is required}
  ETL_STORAGE_SECRET_KEY: ${ETL_STORAGE_SECRET_KEY:?ETL secret key is required}
  TRINO_STORAGE_ACCESS_KEY: ${TRINO_STORAGE_ACCESS_KEY:?Trino access key is required}
  TRINO_STORAGE_SECRET_KEY: ${TRINO_STORAGE_SECRET_KEY:?Trino secret key is required}
  AUDIT_WRITER_STORAGE_ACCESS_KEY: ${AUDIT_WRITER_STORAGE_ACCESS_KEY:?Audit access key is required}
  AUDIT_WRITER_STORAGE_SECRET_KEY: ${AUDIT_WRITER_STORAGE_SECRET_KEY:?Audit secret key is required}
x-bootstrap: &bootstrap
  image: *storage-image
  entrypoint: ["/bin/sh"]
  environment: *bootstrap-environment
  networks: [backend]
  read_only: true
  tmpfs:
    - /tmp:mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  volumes:
    - ./docker/storage:/bootstrap:ro

services:
  storage:
    image: *storage-image
    command: ["server", "/data", "--address", ":9000"]
    environment:
      MINIO_ROOT_USER: ${STORAGE_ROOT_USER:?Storage root user is required}
      MINIO_ROOT_PASSWORD: ${STORAGE_ROOT_PASSWORD:?Storage root password is required}
      MINIO_BROWSER: "off"
      MINIO_REGION_NAME: us-east-1
    # No host ports and no connection to the default/public network.
    networks: [backend]
    volumes:
      - warehouse:/data
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  storage-init:
    <<: *bootstrap
    command: ["/bootstrap/init.sh"]
    depends_on:
      storage:
        condition: service_healthy
    restart: "no"

  storage-check:
    <<: *bootstrap
    profiles: [test]
    command: ["/bootstrap/check.sh"]
    depends_on:
      storage-init:
        condition: service_completed_successfully
    restart: "no"

  catalog-db:
    <<: *postgres
    environment:
      POSTGRES_USER: lakekeeper
      POSTGRES_DB: lakekeeper
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:?Catalog database password is required}
    volumes:
      - catalog_metadata:/var/lib/postgresql/data

  keycloak-db:
    <<: *postgres
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_DB: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Keycloak database password is required}
    volumes:
      - keycloak_metadata:/var/lib/postgresql/data

  openfga-db:
    <<: *postgres
    environment:
      POSTGRES_USER: openfga
      POSTGRES_DB: openfga
      POSTGRES_PASSWORD: ${OPENFGA_DB_PASSWORD:?OpenFGA database password is required}
    volumes:
      - openfga_metadata:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Keycloak database password is required}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Keycloak admin password is required}
      KC_HOSTNAME: http://keycloak:8080
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      CATALOG_BOOTSTRAP_OIDC_CLIENT_SECRET: ${CATALOG_BOOTSTRAP_OIDC_CLIENT_SECRET:?Run scripts/init_secrets.sh to add the bootstrap secret}
      ETL_OIDC_CLIENT_SECRET: ${ETL_OIDC_CLIENT_SECRET:?ETL OIDC secret is required}
      TRINO_OIDC_CLIENT_SECRET: ${TRINO_OIDC_CLIENT_SECRET:?Trino OIDC secret is required}
      AUDIT_WRITER_OIDC_CLIENT_SECRET: ${AUDIT_WRITER_OIDC_CLIENT_SECRET:?Audit OIDC secret is required}
    depends_on:
      keycloak-db:
        condition: service_healthy
    volumes:
      - ./docker/catalog/realm.json:/opt/keycloak/data/import/lakehouse-realm.json:ro
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q '\"status\": \"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  openfga-migrate:
    image: openfga/openfga:v1.14.0
    command: ["migrate"]
    environment: *openfga-environment
    networks: [backend]
    depends_on:
      openfga-db:
        condition: service_healthy
    restart: "no"

  openfga:
    image: openfga/openfga:v1.14.0
    command: ["run"]
    environment:
      <<: *openfga-environment
      OPENFGA_AUTHN_METHOD: preshared
      OPENFGA_AUTHN_PRESHARED_KEYS: ${OPENFGA_PRESHARED_KEY:?OpenFGA API key is required}
      OPENFGA_PLAYGROUND_ENABLED: "false"
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=localhost:8081"]
      interval: 5s
      timeout: 5s
      retries: 20

  catalog-migrate:
    image: *catalog-image
    command: ["migrate"]
    environment: *catalog-environment
    depends_on:
      catalog-db:
        condition: service_healthy
      openfga:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks: [backend]
    restart: "no"

  catalog:
    image: *catalog-image
    command: ["serve"]
    environment: *catalog-environment
    depends_on:
      catalog-db:
        condition: service_healthy
      catalog-migrate:
        condition: service_completed_successfully
      storage:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      openfga:
        condition: service_healthy
    networks: [backend]
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  catalog-init:
    <<: *catalog-client
    command: ["/app/bootstrap.py"]
    environment:
      <<: *catalog-client-environment
      CATALOG_BOOTSTRAP_OIDC_CLIENT_SECRET: ${CATALOG_BOOTSTRAP_OIDC_CLIENT_SECRET:?Bootstrap OIDC secret is required}
    depends_on:
      catalog:
        condition: service_healthy

  catalog-check:
    <<: *catalog-client
    profiles: [test]
    command: ["/app/check.py", "create"]
    depends_on:
      catalog-init:
        condition: service_completed_successfully

  ingest:
    <<: *catalog-client
    profiles: [etl]
    user: "${INGEST_UID:-10001}:${INGEST_GID:-10001}"
    command: ["-m", "ingest.pipeline"]
    environment:
      ETL_OIDC_CLIENT_SECRET: ${ETL_OIDC_CLIENT_SECRET:?ETL OIDC secret is required}
      ETL_STORAGE_ACCESS_KEY: ${ETL_STORAGE_ACCESS_KEY:?ETL access key is required}
      ETL_STORAGE_SECRET_KEY: ${ETL_STORAGE_SECRET_KEY:?ETL secret key is required}
      HMAC_KEY_HEX: ${HMAC_KEY_HEX:?HMAC key is required}
      HMAC_KEY_VERSION: ${HMAC_KEY_VERSION:?HMAC key version is required}
    volumes:
      - ${INGEST_SOURCE_DIR:-./data/raw/synthea/1000-seed42}:/source:ro
      - ${INGEST_EVIDENCE_DIR:-./data/staged/issue17}:/evidence:rw
    depends_on:
      catalog-init:
        condition: service_completed_successfully

  audit-collector:
    <<: *catalog-client
    # Receives Trino HTTP events on the internal network only; no host port.
    user: "${AUDIT_UID:-10001}:${AUDIT_GID:-10001}"
    entrypoint: ["/app/.venv/bin/python", "-m", "uvicorn"]
    command:
      - --factory
      - audit.collector:create_app_from_environment
      - --host=0.0.0.0
      - --port=8090
      - --no-access-log
      - --no-server-header
    environment:
      AUDIT_INGEST_TOKEN: ${AUDIT_INGEST_TOKEN:?Audit ingest token is required}
      AUDIT_SPOOL_DIR: /spool
    volumes:
      # Acknowledged events survive container restarts and rebuilds on the host.
      - ${AUDIT_SPOOL_HOST_DIR:-./data/audit-spool}:/spool:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  trino:
    image: trinodb/trino:476
    # Match the owner of the host's mode-0600 secret files without running as root.
    user: "${TRINO_UID:-1000}:${TRINO_GID:-1000}"
    environment:
      TRINO_INTERNAL_SHARED_SECRET: ${TRINO_INTERNAL_SHARED_SECRET:?Trino internal secret is required}
      TRINO_OIDC_CLIENT_SECRET: ${TRINO_OIDC_CLIENT_SECRET:?Trino OIDC secret is required}
      TRINO_STORAGE_ACCESS_KEY: ${TRINO_STORAGE_ACCESS_KEY:?Trino access key is required}
      TRINO_STORAGE_SECRET_KEY: ${TRINO_STORAGE_SECRET_KEY:?Trino secret key is required}
    depends_on:
      catalog-init:
        condition: service_completed_successfully
    networks: [backend, frontend]
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./docker/trino/config.properties:/etc/trino/config.properties:ro
      - ./docker/trino/node.properties:/etc/trino/node.properties:ro
      - ./docker/trino/jvm.config:/etc/trino/jvm.config:ro
      - ./docker/trino/catalog/iceberg.properties:/etc/trino/catalog/hospital.properties:ro
      - ./docker/trino/auth/password-authenticator.properties:/etc/trino/password-authenticator.properties:ro
      - ./docker/trino/auth/group-provider.properties:/etc/trino/group-provider.properties:ro
      - ./docker/trino/auth/groups.txt:/etc/trino/auth/groups.txt:ro
      - ./docker/trino/access-control.properties:/etc/trino/access-control.properties:ro
      - ./docker/trino/read-only.properties:/etc/trino/read-only.properties:ro
      - ./policies/rules.json:/etc/trino/policies/rules.json:ro
      # Explicit bind type also accepts the generated data/secrets/... relative paths.
      - type: bind
        source: ${TRINO_PASSWORD_FILE:?Trino password file is required}
        target: /etc/trino/auth/password.db
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${TRINO_TLS_PEM:?Trino TLS PEM is required}
        target: /etc/trino/auth/trino.pem
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${TRINO_CA_BUNDLE:?Trino CA bundle is required}
        target: /etc/trino/auth/ca.crt
        read_only: true
        bind: {create_host_path: false}
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /data/trino:mode=1777
      # JNA/OSHI extracts native libraries here during JVM startup.
      - /data/trino/native:mode=1777,exec
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      # The listener opens before authenticators load; wait for starting=false.
      test: ["CMD-SHELL", "curl --fail --silent --cacert /etc/trino/auth/ca.crt https://localhost:8443/v1/info | grep -q '\"starting\"[[:space:]]*:[[:space:]]*false'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

networks:
  # Only the query boundary joins this network, enabling its loopback publication.
  frontend: {}
  backend:
    internal: true

volumes:
  warehouse: {}
  catalog_metadata: {}
  keycloak_metadata: {}
  openfga_metadata: {}
