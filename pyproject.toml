
[project]
name = "governed-lakehouse-with-fine-grained-access-control"
version = "0.1.0"
description = "Synthetic hospital lakehouse governance experiments"
requires-python = ">=3.11"
dependencies = [
  "pandas", "pyarrow", "pyiceberg[s3fs,pyarrow]", "trino",
  "fastapi", "uvicorn", "pydantic", "pyyaml", "httpx",
]

[dependency-groups]
dev = ["pytest", "ruff", "jupyterlab", "matplotlib"]
demo = ["streamlit"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
