# Classification and treatment specification for issue #6; NOT executable Trino policy.
# Inventory/types: policies/schema-contract.yaml; permissions/scopes: policies/access-matrix.csv.
# treatment describes ingestion/storage; roles describes the authorized SQL projection.
# Role drop means deny all column references, not delete the stored value or return NULL.
# Role generalize/mask uses the exact matrix mask_sql, preserving SQL types and NULLs.
# All role treatments remain subject to matrix operations and row scopes.
version: 1
# Allowlist = inventoried target columns plus the explicit source_fields mappings.
unlisted_source_columns: drop

# Logical source names from the original tags, before mapping Synthea export headers.
# Restricted bronze retention is separate; no unlisted column enters a shared table.
source_fields:
  patients:
    patient_id:
      classification: identifier
      treatment: tokenize
      destination: patients.patient_token
    name:
      classification: direct_identifier
      treatment: restricted_table
      destination: identity.name
    ssn:
      classification: direct_identifier
      treatment: drop

tables:
  patients:
    patient_token:
      classification: identifier
      treatment: tokenize
      roles: {doctor: keep, researcher: keep, billing: drop, admin: keep}
      rationale: "Derive once from the source patient ID with versioned HMAC; reuse across tables."
    birthdate:
      classification: quasi_identifier
      treatment: keep
      roles: {doctor: keep, researcher: drop, billing: drop, admin: keep}
      rationale: "Keep DATE for clinical care; derive separate age_band at the fixed UTC age_reference_date."
    age_band:
      classification: quasi_identifier
      treatment: generalize
      roles: {doctor: keep, researcher: keep, billing: drop, admin: keep}
      rationale: "Derive completed-calendar-year bands 00-09 through 80-89 and 90+; NULL/future birthdates yield NULL."
    sex:
      classification: quasi_identifier
      treatment: keep
      roles: {doctor: keep, researcher: keep, billing: drop, admin: keep}
      rationale: "Demographic linkage risk remains when combined with age, geography, or clinical records."
    race:
      classification: quasi_identifier
      treatment: keep
      roles: {doctor: keep, researcher: keep, billing: drop, admin: keep}
      rationale: "Demographic linkage risk remains; visible only in approved clinical and research projections."
    ethnicity:
      classification: quasi_identifier
      treatment: keep
      roles: {doctor: keep, researcher: keep, billing: drop, admin: keep}
      rationale: "Demographic linkage risk remains; visible only in approved clinical and research projections."
    zip:
      classification: quasi_identifier
      treatment: keep
      roles: {doctor: keep, researcher: generalize, billing: drop, admin: keep}
      masks:
        researcher: >-
          CASE WHEN length(zip) IN (5, 10) AND regexp_like(zip, '^[0-9]{5}(-[0-9]{4})?$') THEN substr(zip, 1, 3) || '**' ELSE CAST(NULL AS VARCHAR) END
      rationale: "Preserve exact ZIP for care; research gets three digits plus ** or NULL for invalid/non-US values."
  encounters:
    encounter_id:
      classification: identifier
      treatment: keep
      roles: {doctor: keep, researcher: keep, billing: drop, admin: keep}
      rationale: "Retain an opaque synthetic encounter key; never embed source patient identifiers."
    patient_token:
      classification: identifier
      treatment: tokenize
      roles: {doctor: keep, researcher: keep, billing: drop, admin: keep}
      rationale: "Reuse the same versioned HMAC patient token; do not tokenize an existing token again."
    start_time:
      classification: quasi_identifier
      treatment: keep
      roles: {doctor: keep, researcher: generalize, billing: drop, admin: keep}
      masks:
        researcher: >-
          CAST(date_trunc('month', start_time) AS TIMESTAMP(6))
      rationale: "Store UTC TIMESTAMP(6); research gets UTC month start with the same SQL type."
    stop_time:
      classification: quasi_identifier
      treatment: keep
      roles: {doctor: keep, researcher: generalize, billing: drop, admin: keep}
      masks:
        researcher: >-
          CAST(date_trunc('month', stop_time) AS TIMESTAMP(6))
      rationale: "Store UTC TIMESTAMP(6); research gets UTC month start with the same SQL type."
    encounter_class:
      classification: sensitive_clinical
      treatment: keep
      roles: {doctor: keep, researcher: keep, billing: drop, admin: keep}
      rationale: "Encounter setting describes healthcare use; retain for approved care and research."
    code:
      classification: sensitive_clinical
      treatment: keep
      roles: {doctor: keep, researcher: keep, billing: drop, admin: keep}
      rationale: "Clinical codes may reveal conditions even when linked only by a pseudonymous token."
    description:
      classification: sensitive_clinical
      treatment: keep
      roles: {doctor: keep, researcher: drop, billing: drop, admin: keep}
      rationale: "Clinical free text may contain direct identifiers; hide from research and keep only for care/admin."
    reason_code:
      classification: sensitive_clinical
      treatment: keep
      roles: {doctor: keep, researcher: keep, billing: drop, admin: keep}
      rationale: "Visit-reason codes can disclose sensitive conditions; retain for approved care and research."
    reason_description:
      classification: sensitive_clinical
      treatment: keep
      roles: {doctor: keep, researcher: drop, billing: drop, admin: keep}
      rationale: "Clinical free text may contain direct identifiers; hide from research and keep only for care/admin."
  claims:
    claim_id:
      classification: identifier
      treatment: keep
      roles: {doctor: drop, researcher: drop, billing: keep, admin: keep}
      rationale: "Retain an opaque synthetic claim key for reconciliation; never embed patient identifiers."
    patient_token:
      classification: identifier
      treatment: tokenize
      roles: {doctor: drop, researcher: drop, billing: keep, admin: keep}
      rationale: "Reuse the same versioned HMAC patient token for reconciliation without names."
    encounter_id:
      classification: identifier
      treatment: keep
      roles: {doctor: drop, researcher: drop, billing: keep, admin: keep}
      rationale: "Retain the opaque encounter foreign key consistently with encounters.encounter_id."
    payer:
      classification: financial
      treatment: keep
      roles: {doctor: drop, researcher: drop, billing: keep, admin: keep}
      rationale: "Payer affiliation supports reconciliation and is restricted to billing/admin claims access."
    procedure_code:
      classification: sensitive_clinical
      treatment: keep
      roles: {doctor: drop, researcher: drop, billing: keep, admin: keep}
      rationale: "Exact codes reveal treatment but trusted billing needs them to validate services and charges."
    procedure_description:
      classification: sensitive_clinical
      treatment: keep
      roles: {doctor: drop, researcher: drop, billing: drop, admin: keep}
      rationale: "Free text adds unnecessary clinical detail and possible identifiers; hide from billing."
    total_cost:
      classification: financial
      treatment: keep
      roles: {doctor: drop, researcher: drop, billing: keep, admin: keep}
      rationale: "Exact monetary amounts are needed for billing reconciliation; claims stay denied to doctors/researchers."
    payer_coverage:
      classification: financial
      treatment: keep
      roles: {doctor: drop, researcher: drop, billing: keep, admin: keep}
      rationale: "Exact coverage amounts are needed for billing reconciliation; claims stay denied to doctors/researchers."
  care_team:
    doctor_user:
      classification: direct_identifier
      treatment: keep
      roles: {doctor: drop, researcher: drop, billing: drop, admin: keep}
      rationale: "Authenticated clinician identity; admin-only enumeration, with a separately trusted filter-evaluation path."
    patient_token:
      classification: identifier
      treatment: tokenize
      roles: {doctor: drop, researcher: drop, billing: drop, admin: keep}
      rationale: "Reuse the same versioned HMAC token; assignment membership remains restricted."
    valid_from:
      classification: quasi_identifier
      treatment: keep
      roles: {doctor: drop, researcher: drop, billing: drop, admin: keep}
      rationale: "Assignment date can aid linkage; retain exact UTC start date for query-time row filtering."
    valid_to:
      classification: quasi_identifier
      treatment: keep
      roles: {doctor: drop, researcher: drop, billing: drop, admin: keep}
      rationale: "Retain exact exclusive UTC end date (NULL means ongoing) for query-time row filtering."
  identity:
    patient_token:
      classification: identifier
      treatment: tokenize
      roles: {doctor: drop, researcher: drop, billing: drop, admin: drop}
      rationale: "Reuse the shared HMAC token in the separate restricted identity warehouse; all SQL groups are denied."
    name:
      classification: direct_identifier
      treatment: restricted_table
      roles: {doctor: drop, researcher: drop, billing: drop, admin: drop}
      rationale: "Store only in identity.identity.patient_identity; every MVP SQL group, including admin, is denied."
  audit:
    query_id:
      classification: identifier
      treatment: keep
      roles: {doctor: drop, researcher: drop, billing: drop, admin: keep}
      rationale: "Query correlation key can link events and actors; retain only within restricted audit storage."
    event_type:
      classification: none
      treatment: keep
      roles: {doctor: drop, researcher: drop, billing: drop, admin: keep}
      rationale: "Operational event category; none means no intrinsic personal content, not unrestricted access."
    authenticated_user:
      classification: direct_identifier
      treatment: keep
      roles: {doctor: drop, researcher: drop, billing: drop, admin: keep}
      rationale: "Authenticated user identity is personal data; routine admin may inspect it for accountability."
    groups:
      classification: quasi_identifier
      treatment: keep
      roles: {doctor: drop, researcher: drop, billing: drop, admin: keep}
      rationale: "Role membership can help identify the actor when combined with audit metadata."
    query_text_restricted:
      classification: direct_identifier
      treatment: keep
      roles: {doctor: drop, researcher: drop, billing: drop, admin: drop}
      rationale: "Arbitrary SQL literals may contain direct identifiers, clinical/financial data, or secrets; deny every SQL role."
    tables:
      classification: quasi_identifier
      treatment: keep
      roles: {doctor: drop, researcher: drop, billing: drop, admin: keep}
      rationale: "Resource access patterns can disclose clinical interests or actor activity; admin-only audit metadata."
    columns:
      classification: quasi_identifier
      treatment: keep
      roles: {doctor: drop, researcher: drop, billing: drop, admin: keep}
      rationale: "Selected fields can disclose clinical interests or actor activity; admin-only audit metadata."
    row_filter_tables:
      classification: quasi_identifier
      treatment: keep
      roles: {doctor: drop, researcher: drop, billing: drop, admin: keep}
      rationale: "Which tables were row-filtered for a query; presence only, never the filter expression. Admin-only audit metadata."
    masked_columns:
      classification: quasi_identifier
      treatment: keep
      roles: {doctor: drop, researcher: drop, billing: drop, admin: keep}
      rationale: "Which columns were masked for a query; presence only, never the mask expression. Admin-only audit metadata."
    output_rows_if_available:
      classification: quasi_identifier
      treatment: keep
      roles: {doctor: drop, researcher: drop, billing: drop, admin: keep}
      rationale: "Counts can support small-cohort inference; preserve only for admin audit review."
    status:
      classification: none
      treatment: keep
      roles: {doctor: drop, researcher: drop, billing: drop, admin: keep}
      rationale: "Normalized execution status with no free-text payload; restricted audit access still applies."
    error_code:
      classification: none
      treatment: keep
      roles: {doctor: drop, researcher: drop, billing: drop, admin: keep}
      rationale: "Normalized error code only, never exception messages, SQL text, identifiers, or secrets."
    event_timestamp:
      classification: quasi_identifier
      treatment: keep
      roles: {doctor: drop, researcher: drop, billing: drop, admin: keep}
      rationale: "Exact query time can correlate actor activity; retain UTC TIMESTAMP(6) for admin audit review."
    received_timestamp:
      classification: quasi_identifier
      treatment: keep
      roles: {doctor: drop, researcher: drop, billing: drop, admin: keep}
      rationale: "Exact receipt time can correlate actor activity; retain UTC TIMESTAMP(6) for admin audit review."
    policy_version:
      classification: none
      treatment: keep
      roles: {doctor: drop, researcher: drop, billing: drop, admin: keep}
      rationale: "Non-secret policy version metadata for reproducibility; admin-only audit access still applies."
    policy_digest:
      classification: none
      treatment: keep
      roles: {doctor: drop, researcher: drop, billing: drop, admin: keep}
      rationale: "Digest of policy configuration, not a patient identifier or secret; admin-only audit access still applies."
